name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check generated pages are current
        run: |
          npm run gen
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --short -- docs/
            echo "::error::docs/ is stale. Run 'npm run gen' and commit the result."
            exit 1
          fi

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate CSS
        run: npm run validate:css

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Holds the pattern: nothing from npm may run on this runner. Scans committed docs; validate fails if stale.
  orgs:
    name: Forbidden orgs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]' # Dependabot gets no Actions secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for forbidden org names
        env:
          PATTERN: ${{ secrets.FORBIDDEN_ORGS }}
        run: |
          if [ -z "$PATTERN" ]; then
            echo "::error::FORBIDDEN_ORGS secret is not set."
            exit 1
          fi
          # File names only: a matching line would print the pattern into a public log.
          # 1 is the only pass: `if grep` would read a bad pattern (status 2) as no match.
          status=0
          grep -rIilE -- "$PATTERN" docs content || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::A forbidden org name is in the files above."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep failed with status $status. Check the FORBIDDEN_ORGS pattern."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate, test, orgs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.js dates sitemap URLs from git history

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (stamp SW version, year, lastmod, security.txt)
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs
          include-hidden-files: true # docs/.well-known/security.txt

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    # One deployment at a time
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # This job holds the token: no dependency script may run on its runner.
      - name: Install wrangler
        run: npm ci --ignore-scripts

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy site --project-name=1mb-dev --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a256c6c12e5ff87e9d2444d72ea65e3a
