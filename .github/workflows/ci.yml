name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check generated pages are current
        run: |
          npm run gen
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --short -- docs/
            echo "::error::docs/ is stale. Run 'npm run gen' and commit the result."
            exit 1
          fi

      - name: Lint JavaScript
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate CSS
        run: npm run validate:css

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build.js dates sitemap URLs from git history

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (stamp SW version, year, lastmod, security.txt)
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs
          include-hidden-files: true # docs/.well-known/security.txt

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    # One deployment at a time
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # This job holds the token: no dependency script may run on its runner.
      - name: Install wrangler
        run: npm ci --ignore-scripts

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy site --project-name=1mb-dev --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a256c6c12e5ff87e9d2444d72ea65e3a
